# Render deploy spec — see https://render.com/docs/blueprint-spec
#
# What this provisions on Render:
#   1. ecocode-db        Free Postgres (90-day expiry on free plan)
#   2. ecocode-api       FastAPI backend (Python web service)
#   3. ecocode-frontend  React static site (built once, served from CDN)
#
# After Render imports this Blueprint, you must MANUALLY set:
#   - OPENAI_API_KEY (or GEMINI_API_KEY if you switch LLM_PROVIDER)
# under ecocode-api → Environment, because secrets are not stored in git.

databases:
  - name: ecocode-db
    plan: free
    databaseName: ecocode
    user: ecocode_user

services:
  # ── Backend API ───────────────────────────────────────
  # NOTE: Render removed explicit `plan: free` for web services in
  # Blueprints. Omitting the field lets Render assign a default plan
  # (shown in the preview step when you click Deploy); pick "Free" or
  # "Starter" from the dropdown before applying.
  - type: web
    name: ecocode-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecocode-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openai             # default to OpenAI. Set OPENAI_API_KEY below.
                                  # Switch to "gemini" or "ollama" and set the matching key if needed.
      - key: OPENAI_API_KEY
        sync: false               # set MANUALLY in Render dashboard (or at the Blueprint review step)
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: GEMINI_API_KEY       # only used if LLM_PROVIDER=gemini
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Deterministic Render service URL (avoids circular fromService ref).
      # If you renamed the frontend service in this file, update this to match.
      - key: FRONTEND_URL
        value: https://ecocode-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Frontend (React static site) ─────────────────────
  # CRA bakes env vars at build time, so REACT_APP_API_BASE_URL must be
  # known before `npm run build` runs. Render injects envVars during the
  # build phase for static sites.
  - type: web
    name: ecocode-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Deterministic backend URL (avoids circular fromService ref).
      - key: REACT_APP_API_BASE_URL
        value: https://ecocode-api.onrender.com
    routes:
      # SPA rewrite: every unknown path serves index.html so react-router
      # can take over.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Lightweight security headers; safe for a public-read static site.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
